services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vyapaarcart
      POSTGRES_USER: vyapaarcart
      POSTGRES_PASSWORD: vyapaarcart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vyapaarcart -d vyapaarcart"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      target: development
    command: sh -c 'npm run db:push && DATABASE_URL_UNPOOLED=$$DATABASE_URL node scripts/migrate-inventory-reservations.mjs && npm run dev'
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://vyapaarcart:vyapaarcart@db:5432/vyapaarcart
      WATCHPACK_POLLING: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules

volumes:
  postgres_data:
  app_node_modules:
